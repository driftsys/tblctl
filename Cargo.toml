[package]
name = "tblctl"
version = "0.0.1"
edition = "2021"
description = "Hermetic CLI that converts and checks tables for Markdown docs (XLSX/XLS/XLSB/ODS/DOCX/CSV/Markdown)"
license = "MIT"
repository = "https://github.com/driftsys/tblctl"
readme = "README.md"
keywords = ["cli", "table", "xlsx", "csv", "markdown"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
calamine = { version = "0.38", features = ["picture", "dates"] }
csv = "1.4.0"
rust_xlsxwriter = "0.102.0"
quick-xml = "0.42.0"
zip = "9.5.1"
sha2 = "0.11.1"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
